<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Earn</title>

<script src="//libtl.com/sdk.js"
        data-zone="10959136"
        data-sdk="show_10959136"></script>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}
.card{
    background:#222;
    border-radius:15px;
    padding:20px;
    margin:15px 0;
}
button{
    width:90%;
    max-width:350px;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
.watch{background:#28a745;color:#fff;}
.bonus{background:#007bff;color:#fff;}
.spin{background:#ff9800;color:#fff;}
</style>
</head>
<body>

<h1>💰 Easy Earn</h1>

<div class="card">
    <h2>Balance</h2>
    <h1 id="balance">0</h1>
</div>

<button class="watch" onclick="watchAd()">🎥 Watch Ad</button>
<button class="bonus" onclick="dailyBonus()">🎁 Daily Bonus</button>
<button class="spin" onclick="spin()">🎡 Lucky Spin</button>

<script>
let balance = 0;

function updateBalance(){
    document.getElementById("balance").textContent = balance;
}

show_10959136({
  type: 'inApp',
  inAppSettings: {
    frequency: 2,
    capping: 0.1,
    interval: 30,
    timeout: 5,
    everyPage: false
  }
});

function watchAd(){
    show_10959136('pop')
    .then(() => {
        balance += 10;
        updateBalance();
        alert("Reward Added");
    })
    .catch(() => {
        alert("Ad unavailable");
    });
}

function dailyBonus(){
    balance += 20;
    updateBalance();
    alert("Daily Bonus Claimed");
}

function spin(){
    let reward = Math.floor(Math.random()*50)+1;
    balance += reward;
    updateBalance();
    alert("You won " + reward + " coins");
}

updateBalance();
</script>

</body>
</html>
