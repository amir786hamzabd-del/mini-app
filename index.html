<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Earn</title>

<script src="//libtl.com/sdk.js"
        data-zone="10959136"
        data-sdk="show_10959136"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#121212;
color:white;
text-align:center;
padding:20px;
}

h1{
margin-bottom:20px;
}

.card{
background:#1e1e1e;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(255,255,255,.1);
}

.balance{
font-size:40px;
font-weight:bold;
color:#00ff88;
}

button{
width:90%;
max-width:350px;
padding:15px;
margin:10px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.watch{
background:#28a745;
color:white;
}

.bonus{
background:#007bff;
color:white;
}

.spin{
background:#ff9800;
color:white;
}

.footer{
margin-top:30px;
opacity:.7;
font-size:14px;
}
</style>
</head>
<body>

<h1>💰 Easy Earn</h1>

<div class="card">
<h3>Your Balance</h3>
<div class="balance" id="balance">0</div>
</div>

<button class="watch" onclick="watchAd()">🎥 Watch Ad & Earn</button>

<button class="bonus" onclick="dailyBonus()">🎁 Daily Bonus</button>

<button class="spin" onclick="spinWheel()">🎡 Lucky Spin</button>

<div class="footer">
Telegram Mini App + Monetag
</div>

<script>

let balance = 0;

function updateBalance(){
document.getElementById("balance").innerText = balance;
}

// Auto In-App Ads
show_10959136({
type:'inApp',
inAppSettings:{
frequency:2,
capping:0.1,
interval:30,
timeout:5,
everyPage:false
}
});

// Watch Ad Button
function watchAd(){

show_10959136('pop')
.then(()=>{

balance += 10;
updateBalance();

alert("✅ Ad watched successfully!\n+10 Coins");

})
.catch(()=>{

alert("❌ Ad unavailable. Try again later.");

});

}

// Daily Bonus
function dailyBonus(){

balance += 20;
updateBalance();

alert("🎁 Daily Bonus Claimed!");

}

// Lucky Spin
function spinWheel(){

let reward = Math.floor(Math.random()*50)+1;

balance += reward;

updateBalance();

alert("🎉 You won " + reward + " coins!");

}

updateBalance();

</script>

</body>
</html>
